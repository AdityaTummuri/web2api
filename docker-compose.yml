version: "3.8"

services:
  web2api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: web2api-bridge
    restart: unless-stopped
    ports:
      - "${PORT:-8000}:8000"
    environment:
      - HOST=0.0.0.0
      - PORT=8000
      - WEB2API_API_KEY=${WEB2API_API_KEY:-}
      - CORS_ORIGINS=${CORS_ORIGINS:-*}
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s
