<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Web2API Pro Console</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="container">
    <!-- Header -->
    <header class="header">
      <div class="logo-group">
        <div class="logo-icon">⚡</div>
        <div>
          <h1 class="title">Web2API Pro</h1>
          <span class="subtitle">Firefox / Zen AI Chat Bridge</span>
        </div>
      </div>
      <div class="badge-group">
        <span id="bridgeBadge" class="badge badge-disconnected">Bridge: Offline</span>
        <span id="tabBadge" class="badge badge-warning">Tab: Searching</span>
      </div>
    </header>

    <!-- Navigation / Quick Actions -->
    <div class="toolbar">
      <button id="openGeminiBtn" class="btn btn-secondary btn-sm" title="Open Google Gemini">
        <span>🌐</span> Gemini
      </button>
      <button id="openChatgptBtn" class="btn btn-secondary btn-sm" title="Open ChatGPT">
        <span>💬</span> ChatGPT
      </button>
      <button id="openClaudeBtn" class="btn btn-secondary btn-sm" title="Open Claude">
        <span>🧠</span> Claude
      </button>
      <button id="resetChatBtn" class="btn btn-secondary btn-sm" title="Start New Conversation">
        <span>🔄</span> New Chat
      </button>
    </div>

    <!-- Bridge Connection Settings Bar -->
    <div class="bridge-config-row">
      <div class="input-with-button">
        <input type="text" id="bridgeUrlInput" placeholder="ws://127.0.0.1:8000/ws?token=sk-w2a-..." title="Bridge URL. Include ?token=&lt;key&gt; from api.txt when the server has API keys." spellcheck="false" autocomplete="off" />
        <button id="reconnectBridgeBtn" class="btn btn-secondary btn-sm">Connect</button>
      </div>
    </div>

    <!-- Playground Prompt Box -->
    <div class="card">
      <div class="card-header">
        <label for="promptInput" class="card-title">Live Prompt Console</label>
        <div class="select-group">
          <select id="modelSelect" class="dropdown-mini" title="Target Model / Provider">
            <option value="auto">Auto-Detect Active Tab</option>
            <option value="gemini-pro">Gemini (gemini-pro)</option>
            <option value="gpt-4o">ChatGPT (gpt-4o)</option>
            <option value="claude-3-5-sonnet">Claude (claude-3.5)</option>
          </select>
          <select id="formatSelect" class="dropdown-mini" title="Output Format">
            <option value="openai">OpenAI JSON</option>
            <option value="code">Code Only</option>
            <option value="markdown">Markdown</option>
          </select>
        </div>
      </div>
      <textarea id="promptInput" rows="3" placeholder="Enter prompt to execute via active browser session (e.g. Write a thread-safe LRU cache in Rust)..."></textarea>
      
      <div class="action-row">
        <div class="stats-mini" id="requestStats">
          Total Calls: <span id="statCount">0</span>
        </div>
        <div class="btn-group-right">
          <button id="copyCurlBtn" class="btn btn-secondary btn-sm" title="Copy OpenAI cURL command">
            <span>📋</span> cURL
          </button>
          <button id="sendBtn" class="btn btn-primary">
            <span id="btnIcon">🚀</span> Run Prompt
          </button>
        </div>
      </div>
    </div>

    <!-- Output Console -->
    <div class="card output-card">
      <div class="card-header">
        <span class="card-title">Response Output</span>
        <div class="output-actions">
          <span id="latencyBadge" class="badge-mini">0.0s</span>
          <button id="copyOutputBtn" class="btn-text" title="Copy Output">Copy</button>
        </div>
      </div>
      <pre id="outputView"><code>Awaiting query... Output and extracted code blocks will appear here in structured API format.</code></pre>
    </div>

    <!-- Footer -->
    <footer class="footer">
      <span>API Endpoint: <code>http://127.0.0.1:8000/v1/chat/completions</code></span>
    </footer>
  </div>

  <script src="popup.js"></script>
</body>
</html>
