[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "web2api-client"
version = "2.0.0"
authors = [
  { name = "Web2API Team", email = "dev@web2api.local" },
]
description = "Universal Python client for the Web2API standalone server (ChatGPT, Claude, Gemini)."
readme = "README.md"
requires-python = ">=3.8"
dependencies = [
    "httpx>=0.25.0",
]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]

[project.urls]
"Homepage" = "https://github.com/seeramsujay/web2api"
"Bug Tracker" = "https://github.com/seeramsujay/web2api/issues"
